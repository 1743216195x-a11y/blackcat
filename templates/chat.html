<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>黑猫 AI 聊天</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    header {
      margin-top: 20px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    header a {
      font-size: 14px;
      color: #555;
      text-decoration: none;
    }
    #chat-container {
      flex: 1;
      margin: 20px auto;
      width: 90%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      border: 2px solid #333;
      border-radius: 15px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }
    .msg {
      max-width: 70%;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #000;
      color: #fff;
      border-bottom-right-radius: 0;
    }
    .ai {
      align-self: flex-start;
      background: #e6e6e6;
      color: #000;
      border-bottom-left-radius: 0;
    }
    #chat-input {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
      background: #fff;
    }
    #userInput {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
    }
    #sendBtn {
      margin-left: 10px;
      padding: 12px 20px;
      font-size: 15px;
      border: none;
      border-radius: 25px;
      background: black;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    #sendBtn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>黑猫 AI 聊天</h1>
    <a href="/">← 返回首页</a>
  </header>

  <div id="chat-container">
    <div id="messages"></div>
    <div id="chat-input">
      <input id="userInput" type="text" placeholder="问黑猫AI..." onkeypress="if(event.key==='Enter'){sendMessage();}" />
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      let input = document.getElementById("userInput").value.trim();
      if (!input) return;

      let messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="msg user">${input}</div>`;
      document.getElementById("userInput").value = "";
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: input })
      })
      .then(response => response.json())
      .then(data => {
        let answer = data.answer;
        messagesDiv.innerHTML += `<div class="msg ai">${answer}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      })
      .catch(err => {
        messagesDiv.innerHTML += `<div class="msg ai">出错了，请重试</div>`;
      });
    }
  </script>
</body>
</html>
